<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Galería de Videos</title>

<style>

body{
    background:#000;
    color:white;
    font-family:Arial;
    margin:0;
    padding:40px;
}

h1{
    text-align:center;
    margin-bottom:40px;
    letter-spacing:5px;
}

/* BOTÓN VOLVER */
.volver{
    display:inline-block;
    margin-bottom:30px;
    color:#deff9a;
    text-decoration:none;
    border:1px solid #deff9a;
    padding:10px 20px;
    border-radius:5px;
    transition:0.4s;
}

.volver:hover{
    background:#deff9a;
    color:black;
}

/* GALERÍA */
.galeria-videos{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:25px;
}

/* VIDEOS */
.galeria-videos video{
    width:100%;
    border-radius:15px;
    box-shadow:0 0 15px rgba(222,255,154,0.2);
    transition:0.4s;
}

.galeria-videos video:hover{
    transform:scale(1.02);
    box-shadow:0 0 25px #deff9a;
}

</style>
</head>

<body>

<a href="ZUBLIME.html" class="volver">
← Volver
</a>

<h1>GALERÍA DE VIDEOS</h1>

<div class="galeria-videos">

    <video controls>
        <source src="video1tae4.mp4" type="video/mp4">
    </video>

    <video controls>
        <source src="video5tae4.mov" type="video/mp4">
    </video>

    <video controls>
        <source src="video3tae4.mp4" type="video/mp4">
    </video>

</div>

</body>
</html>
